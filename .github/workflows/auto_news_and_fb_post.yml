name: Auto News Update & Facebook Auto Poster

on:
  schedule:
    # প্রতি ১ ঘণ্টা পর পর স্বয়ংক্রিয়ভাবে চলবে
    - cron: '0 */1 * * *'
  workflow_dispatch: # গিটহাব থেকে ম্যানুয়ালি যেকোনো সময় 'Run workflow' বাটনে ক্লিক করে চালানোর জন্য

jobs:
  auto-news-and-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install

      - name: Run Auto News Scraper & Facebook Poster
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          WEBSITE_URL: ${{ secrets.WEBSITE_URL || 'https://obiramnews.infy.click' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET || 'obiram_cron_secure_key' }}
        run: |
          npx tsx scripts/github_runner.ts
